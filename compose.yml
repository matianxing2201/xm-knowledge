services:
  xm-knowledge:
    build: .
    image: xm-knowledge:latest
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - xm-knowledge

volumes:
  caddy_data:
  caddy_config:
